version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint@8.63.0 peers typescript ">=4.8.4 <6.1.0" (checked
      # 2026-07-10; TS 7.0.2 broke npm ci — PR #5). Allow patches only; drop
      # this once typescript-eslint's peer range admits newer TypeScript.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # ts-fsrs 6 replaces Card/fsrs/createEmptyCard/next with DefaultScheduler
      # and a new card shape (stored cards would need migrating); #24 failed
      # no-deprecated lint. Hold majors until that migration is done.
      - dependency-name: "ts-fsrs"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
